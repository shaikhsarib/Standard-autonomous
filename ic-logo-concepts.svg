<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="780" height="300" fill="#f2f2f2"/>

  <!-- Concept A: I + open C with central dot -->
  <g transform="translate(10,10)">
    <rect x="2" y="2" width="236" height="236" rx="52" fill="#0b0b0b"/>
    <rect x="12" y="12" width="216" height="216" rx="44" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
    <rect x="62" y="70" width="18" height="100" rx="9" fill="#fff"/>
    <path d="M172 87.8 A42 42 0 1 0 172 152.2" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="145" cy="120" r="8" fill="#fff"/>
    <text x="120" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#333">A · CORE</text>
  </g>

  <!-- Concept B: block grid IC -->
  <g transform="translate(270,10)">
    <rect x="2" y="2" width="236" height="236" rx="52" fill="#0b0b0b"/>
    <g fill="#fff">
      <rect x="60" y="76" width="24" height="24" rx="6"/>
      <rect x="60" y="108" width="24" height="24" rx="6"/>
      <rect x="60" y="140" width="24" height="24" rx="6"/>
      <rect x="100" y="76" width="24" height="24" rx="6"/>
      <rect x="132" y="76" width="24" height="24" rx="6"/>
      <rect x="164" y="76" width="24" height="24" rx="6"/>
      <rect x="100" y="108" width="24" height="24" rx="6"/>
      <rect x="100" y="140" width="24" height="24" rx="6"/>
      <rect x="132" y="140" width="24" height="24" rx="6"/>
      <rect x="164" y="140" width="24" height="24" rx="6"/>
    </g>
    <text x="120" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#333">B · BLOCKS</text>
  </g>

  <!-- Concept C: I + C built from two stacked arcs -->
  <g transform="translate(530,10)">
    <rect x="2" y="2" width="236" height="236" rx="52" fill="#0b0b0b"/>
    <rect x="62" y="70" width="18" height="100" rx="9" fill="#fff"/>
    <path d="M172 87.8 A42 42 0 0 0 104.4 109.1" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <path d="M104.4 130.9 A42 42 0 0 0 172 152.2" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <text x="120" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#333">C · SPLIT ARC</text>
  </g>
</svg>
